[project]
name = "albatross"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["bird-feeder", "tqdm>=4,<5","seeds"]

[tool.uv.sources]
bird-feeder = { workspace = true }
seeds = { workspace = true}

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"
